# Alembic configuration — Multifamily Market Intelligence Platform.
# Migrations are forward-only and reviewed before running (CLAUDE.md, TDS §3.4).
# The sqlalchemy.url is resolved at runtime from MIP_DATABASE_URL in env.py
# (the schema-owner connection), so no credentials live in this file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# version_path_separator and timezone left at defaults.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
